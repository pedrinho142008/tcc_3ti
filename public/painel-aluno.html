<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Aluno — E.E.I.M</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <link rel="stylesheet" href="/assets/css/atividades.css" />
</head>
<body class="admin-body">
  <div class="admin-wrap">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="admin-brand-icon">A</div>
        <div>
          <div class="admin-brand-title">E.E.I.M</div>
          <div class="admin-brand-sub">Portal do Aluno</div>
        </div>
      </div>

      <nav class="admin-nav">
        <button class="admin-nav-item active" data-aba="boletim">
          <span class="admin-nav-icon">▤</span>
          <span>Boletim</span>
        </button>
        <button class="admin-nav-item" data-aba="atividades">
          <span class="admin-nav-icon">▦</span>
          <span>Atividades</span>
        </button>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/" class="admin-link-sec">Ver site</a>
        <button id="btn-sair" class="admin-link-sec admin-link-danger">Sair</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <h1 class="admin-title" id="titulo-aba">Boletim</h1>
          <p class="admin-subtitle" id="sub-aba">Suas notas do ano letivo</p>
        </div>
        <div class="admin-user">
          <div class="admin-user-avatar" id="user-avatar">A</div>
          <div>
            <div class="admin-user-name" id="user-nome">—</div>
            <div class="admin-user-role" id="user-cargo">—</div>
          </div>
        </div>
      </header>

      <div id="conteudo-aluno"></div>
      <div id="conteudo-atividades" class="hidden"></div>
    </main>
  </div>

  <script type="module">
    import { api, esc, mostrarLoading, esconderLoading } from "/assets/js/shared.js";
    import { initAtividades } from "/assets/js/atividades-aluno.js";

    let alunoAtual = null;
    let boletimCache = null;

    // Pega aluno do localStorage
    const alunoStr = localStorage.getItem("aluno");
    if (!alunoStr) window.location.href = "/portal-aluno.html";

    try {
      alunoAtual = JSON.parse(alunoStr);
      boletimCache = alunoAtual.boletim || null;
    } catch {
      localStorage.removeItem("aluno");
      window.location.href = "/portal-aluno.html";
    }

    // Confirma sessão
    try {
      const me = await api("/api/aluno/me");
      alunoAtual = { ...alunoAtual, ...me };
    } catch {
      localStorage.removeItem("aluno");
      window.location.href = "/portal-aluno.html";
    }

    document.getElementById("user-nome").textContent = alunoAtual.nome;
    document.getElementById("user-cargo").textContent = alunoAtual.matricula;
    document.getElementById("user-avatar").textContent =
      (alunoAtual.nome || "A").charAt(0).toUpperCase();

    document.getElementById("btn-sair").addEventListener("click", async () => {
      await api("/api/aluno/logout", { method: "POST" }).catch(() => {});
      localStorage.removeItem("aluno");
      window.location.href = "/portal-aluno.html";
    });

    const titulos = {
      boletim: ["Boletim", "Suas notas do ano letivo"],
      atividades: ["Atividades", "Envie e acompanhe suas entregas"],
    };

    document.querySelectorAll(".admin-nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".admin-nav-item").forEach((x) =>
          x.classList.remove("active")
        );
        btn.classList.add("active");
        const aba = btn.dataset.aba;
        document.getElementById("titulo-aba").textContent = titulos[aba][0];
        document.getElementById("sub-aba").textContent = titulos[aba][1];
        carregar(aba);
      });
    });

    async function carregar(aba) {
      const elBoletim = document.getElementById("conteudo-aluno");
      const elAtividades = document.getElementById("conteudo-atividades");

      elBoletim.classList.remove("hidden");
      elAtividades.classList.add("hidden");

      if (aba === "atividades") {
        elBoletim.classList.add("hidden");
        elAtividades.classList.remove("hidden");
        await initAtividades(alunoAtual);
        return;
      }

      mostrarLoading("Carregando boletim...");
      try {
        if (!boletimCache) {
          boletimCache = await api("/api/aluno/boletim");
        }
        elBoletim.innerHTML = renderBoletim(boletimCache);
      } catch (e) {
        elBoletim.innerHTML = `
          <div class="admin-section">
            <p style="color:#c53030">Erro: ${esc(e.message)}</p>
            <p style="color:#8895a7;font-size:0.85rem;margin-top:8px">
              Sua sessão do SigEduc pode ter expirado. Faça logout e login novamente.
            </p>
          </div>`;
      } finally {
        esconderLoading();
      }
    }

    function renderBoletim(b) {
      if (!b?.disciplinas?.length) {
        return `
          <div class="admin-section">
            <div class="admin-empty">
              <div class="admin-empty-icon">▤</div>
              Nenhuma nota encontrada
            </div>
          </div>`;
      }

      const s = b.situacao || {};
      return `
        <div class="admin-section">
          <div class="admin-section-title">
            Notas por disciplina — ${esc(b.aluno?.nome || alunoAtual.nome)}
          </div>
          <div style="font-size:0.85rem;color:#5a6472;margin-bottom:14px">
            ${esc(b.turma?.turma || "")} • ${esc(b.turma?.serie || "")} • ${esc(b.turma?.turno || "")}
          </div>
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse;font-size:0.85rem;min-width:600px">
              <thead style="background:#1e3c72;color:white">
                <tr>
                  <th style="padding:10px;text-align:left">Disciplina</th>
                  <th style="padding:10px">Professor(a)</th>
                  <th style="padding:10px">1º</th>
                  <th style="padding:10px">2º</th>
                  <th style="padding:10px">3º</th>
                  <th style="padding:10px">4º</th>
                  <th style="padding:10px">Faltas</th>
                </tr>
              </thead>
              <tbody>
                ${b.disciplinas.map((d) => `
                  <tr style="border-bottom:1px solid #e6e9ef">
                    <td style="padding:10px;font-weight:600">${esc(d.nome)}</td>
                    <td style="padding:10px;font-size:0.8rem">${esc(d.professor || "—")}</td>
                    <td style="padding:10px;text-align:center">${esc(d.bim1 || "—")}</td>
                    <td style="padding:10px;text-align:center">${esc(d.bim2 || "—")}</td>
                    <td style="padding:10px;text-align:center">${esc(d.bim3 || "—")}</td>
                    <td style="padding:10px;text-align:center">${esc(d.bim4 || "—")}</td>
                    <td style="padding:10px;text-align:center">${esc(d.faltas || "0")}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="admin-section">
          <div class="admin-section-title">Resumo da série</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
            ${cardResumo(s.status || "—", "Situação")}
            ${cardResumo(s.frequencia || "—", "Frequência")}
            ${cardResumo(s.faltas || "0", "Faltas")}
            ${cardResumo(s.aulasDadas || "0", "Aulas dadas")}
          </div>
        </div>
      `;
    }

    function cardResumo(valor, label) {
      return `
        <div style="background:#f5f7fa;padding:16px;border-radius:12px;text-align:center">
          <div style="font-size:1.3rem;font-weight:800;color:#1e3c72">${esc(valor)}</div>
          <div style="font-size:0.68rem;color:#8895a7;text-transform:uppercase;margin-top:6px">${esc(label)}</div>
        </div>`;
    }

    carregar("boletim");
  </script>
</body>
</html>
