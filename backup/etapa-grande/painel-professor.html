<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Portal do Professor — E.E.I.M</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.png" />

  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <link rel="stylesheet" href="/assets/css/classroom.css" />
  <link rel="stylesheet" href="/assets/css/painel-novo.css" />

  <link rel="stylesheet" href="/assets/css/dashboard.css" />

</head>
<body class="painel-body">

  <!-- TOPBAR -->
  <header class="painel-topbar">
    <button class="painel-menu-btn" id="btn-hamburger" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <img src="/assets/img/logo.png" alt="E.E.I.M" class="painel-topbar-logo" />

    <div class="painel-topbar-info">
      <h1>E.E.I.M — Portal do Professor</h1>
      <p id="topbar-aba">Minhas turmas</p>
    </div>

    <div class="painel-topbar-user">
      <div class="painel-topbar-avatar" id="user-avatar">P</div>
      <div class="painel-topbar-nome" id="user-nome">—</div>
    </div>
  </header>

  <div class="painel-overlay" id="overlay"></div>

  <aside class="painel-sidebar" id="sidebar">
        <!-- Perfil do usuário na sidebar -->
    <div class="painel-perfil-sidebar">
      <div class="painel-perfil-avatar" id="user-avatar-sidebar">P</div>
      <div class="painel-perfil-info">
        <div class="painel-perfil-nome" id="user-nome-sidebar">—</div>
        <div class="painel-perfil-cargo" id="user-cargo-sidebar">—</div>
      </div>
    </div>

<div class="painel-sidebar-brand">
      <img src="/assets/img/logo.png" alt="E.E.I.M" />
      <div class="painel-sidebar-brand-txt">
        <h1>E.E.I.M</h1>
        <p>Portal do Professor</p>
      </div>
    </div>

    <nav class="painel-nav">
      <button class="painel-nav-item" data-aba="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>

      </button>
      <button class="painel-nav-item" data-aba="cadastrar">

      </button>
      <button class="painel-nav-item" data-aba="postar">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>

      <button class="painel-nav-item" data-aba="pesquisa">

        <span>Desempenho</span>
      </button>
      <button class="painel-nav-item" data-aba="dicas">
        <svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>

      <button id="btn-sair" class="painel-footer-btn perigo">

  <main class="painel-main">
    <div class="painel-titulo-secao">
      <h2 id="titulo-aba">Minhas turmas</h2>
      <p id="sub-aba">Acompanhe suas turmas</p>

  <script type="module" src="/assets/js/painel-professor-novo.js?v=1790592883"></script>
  <script src="/assets/js/menu-delegation.js"></script>
  <script src="/assets/js/btn-sair-limpo.js"></script>
